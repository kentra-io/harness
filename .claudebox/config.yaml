image: claudebox-agent:latest
resources:
  cpus: 2
  memory: 8g
  tmpfs_size: 2g
network:
  expose_host_ports: []
env:
  GITHUB_TOKEN: ${KENTRA_BOT_GH_TOKEN}
  GH_TOKEN: ${KENTRA_BOT_GH_TOKEN}
  # Force every commit made inside claudebox to the kentra-gh-bot (token owner)
  # identity. These GIT_* vars sit above even repo-local user.name/user.email in
  # git's precedence, so per-repo overrides (e.g. the harness repo's committed
  # identity) don't apply here — and being container-only, the host identity is
  # untouched. Pushes already authenticate as the bot via the token.
  GIT_AUTHOR_NAME: kentra-gh-bot
  GIT_AUTHOR_EMAIL: 299105882+kentra-gh-bot@users.noreply.github.com
  GIT_COMMITTER_NAME: kentra-gh-bot
  GIT_COMMITTER_EMAIL: 299105882+kentra-gh-bot@users.noreply.github.com
claude:
  model: opus
  max_turns: 50
  system_prompt: ""
  idle_notification: true
provisioning:
  bind_claude_dir: true
  elements: []
docker:
  testcontainers: false
security:
  # Opt-in for the orchestration build (M2-pre, user-authorized 2026-07-07):
  # lets an in-box `cb run` create sibling boxes. Non-escalating — the proxy
  # still pins claudebox.project-path to the requester's own project and
  # confines bind-mount sources to the requester's own mounts. Requires the
  # host cb + claudebox-socket-proxy image rebuilt from claudebox main, and
  # the proxy container recreated (EnsureSocketProxy won't replace a running
  # one).
  allow_nested_box_creation: true
